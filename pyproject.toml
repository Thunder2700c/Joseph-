[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joseph-offline-ai"
version = "0.1.0"
description = "From-scratch offline Hu Tao character-model research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.3"]
test = ["torch>=2.3"]

[tool.setuptools.packages.find]
include = ["joseph*", "training*"]
