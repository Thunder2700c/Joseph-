name: Preserve verified 200M base corpus
run-name: Archive the successful 200M corpus and tokenizer as a permanent release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-merged-base-corpus.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: archive-merged-base-corpus
  cancel-in-progress: false

jobs:
  preserve-merged-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download the successful 200M corpus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/merged
          gh run download 41429138745 \
            --repo "$GITHUB_REPOSITORY" \
            --name joseph-cosmopedia-v2-merged-200m-tokenizer \
            --dir work/merged
          test -s work/merged/cosmopedia-v2/train.txt
          test -s work/merged/cosmopedia-v2/validation.txt
          test -s work/merged/cosmopedia-v2/manifest.json
          test -s work/merged/tokenizer.json
          test -s work/merged/tokenizer.json.manifest.json

      - name: Verify final corpus, tokenizer and package the release asset
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("work/merged")
          corpus = root / "cosmopedia-v2"
          manifest = json.loads((corpus / "manifest.json").read_text(encoding="utf-8"))
          tokenizer_manifest = json.loads((root / "tokenizer.json.manifest.json").read_text(encoding="utf-8"))

          assert manifest["dataset_revision"] == "3ba9d60"
          assert manifest["dataset_license"] == "ODC-By-1.0"
          assert len(manifest["shards"]) == 20
          assert manifest["samples"]["total_characters"] == 199_947_904
          assert manifest["samples"]["train"] == 50_907
          assert manifest["samples"]["validation"] == 2_687
          assert manifest["samples"]["duplicates_removed_across_shards"] == 11
          assert tokenizer_manifest["validation_or_test_text_used_for_fitting"] is False
          assert tokenizer_manifest["tokenizer_sha256"] == hashlib.sha256((root / "tokenizer.json").read_bytes()).hexdigest()
          assert tokenizer_manifest["input_sha256"] == hashlib.sha256((corpus / "train.txt").read_bytes()).hexdigest()
          for name in ("train.txt", "validation.txt"):
              assert manifest["files"][name]["sha256"] == hashlib.sha256((corpus / name).read_bytes()).hexdigest()

          print(json.dumps({
              "source_shards": len(manifest["shards"]),
              "samples": manifest["samples"],
              "train_characters": manifest["files"]["train.txt"]["characters"],
              "validation_characters": manifest["files"]["validation.txt"]["characters"],
              "tokenizer_bytes": (root / "tokenizer.json").stat().st_size,
              "tokenizer_sha256": tokenizer_manifest["tokenizer_sha256"],
              "validation_data_used_for_tokenizer": False,
          }, ensure_ascii=False, indent=2))
          PY
          (cd work/merged && zip -q -r "$GITHUB_WORKSPACE/joseph-cosmopedia-v2-merged-200m-tokenizer.zip" .)
          sha256sum joseph-cosmopedia-v2-merged-200m-tokenizer.zip

      - name: Publish the permanent merged-corpus release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Successful general-language corpus merge for Joseph.

          - Dataset: HuggingFaceTB/smollm-corpus, cosmopedia-v2
          - Pinned dataset revision: 3ba9d60
          - Licence declared by the dataset card: ODC-By-1.0
          - Verified disjoint source partitions: 20 of 20
          - Merged characters after global deduplication: 199,947,904
          - Training samples: 50,907
          - Validation samples: 2,687
          - Duplicate samples removed across shards: 11
          - Approximate tokens at four characters per token: 49,986,976
          - Project-trained ByteLevel BPE vocabulary: 8,192
          - Validation text was not used to fit the tokenizer.

          Includes both corpus splits, provenance and SHA-256 manifest,
          tokenizer and tokenizer manifest, and dataset attribution notes.
          This is a corpus and tokenizer artifact, not a trained neural language model.

          Source dataset card: https://huggingface.co/datasets/HuggingFaceTB/smollm-corpus
          EOF
          gh release create joseph-base-corpus-merged-200m-2026-11-02 \
            joseph-cosmopedia-v2-merged-200m-tokenizer.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Joseph general-language corpus — 200M characters" \
            --notes-file release-notes.md
