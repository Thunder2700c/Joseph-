name: Preserve 10M base-corpus pilot
run-name: Archive verified 10M Cosmopedia pilot as a permanent release asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-base-corpus-pilot.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: archive-base-corpus-pilot
  cancel-in-progress: false

jobs:
  preserve-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download the verified 10M pilot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/pilot
          gh run download 41428063861 \
            --repo "$GITHUB_REPOSITORY" \
            --name joseph-base-tokenizer-cosmopedia-v2 \
            --dir work/pilot
          test -s work/pilot/cosmopedia-v2/train.txt
          test -s work/pilot/cosmopedia-v2/validation.txt
          test -s work/pilot/cosmopedia-v2/manifest.json
          test -s work/pilot/tokenizer.json
          test -s work/pilot/tokenizer.json.manifest.json

      - name: Verify pilot provenance and package the release asset
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("work/pilot")
          manifest = json.loads((root / "cosmopedia-v2/manifest.json").read_text(encoding="utf-8"))
          assert manifest["dataset_revision"] == "3ba9d60"
          assert manifest["dataset_license"] == "ODC-By-1.0"
          assert manifest["shard"] == {
              "count": 20,
              "index": 0,
              "method": "IterableDataset.shard before per-shard shuffle",
          }
          for name in ("train.txt", "validation.txt"):
              data = (root / "cosmopedia-v2" / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == manifest["files"][name]["sha256"]
          print(json.dumps({
              "shard": manifest["shard"],
              "samples": manifest["samples"],
              "dataset_revision": manifest["dataset_revision"],
              "license": manifest["dataset_license"],
          }, ensure_ascii=False, indent=2))
          PY
          (cd work/pilot && zip -q -r "$GITHUB_WORKSPACE/joseph-base-corpus-10m-shard-0.zip" .)
          sha256sum joseph-base-corpus-10m-shard-0.zip

      - name: Publish the permanent pilot release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Verified 10M-character general-language corpus pilot for Joseph.

          - Dataset: HuggingFaceTB/smollm-corpus, cosmopedia-v2
          - Pinned revision: 3ba9d60
          - Licence declared by the dataset card: ODC-By-1.0
          - Source partition: shard 0 of 20
          - Characters: 9,999,831
          - Training samples: 2,539
          - Validation samples: 147
          - Tokenizer: project-trained ByteLevel BPE, vocabulary 8,192
          - Validation text was not used to fit the tokenizer.

          The archive includes the corpus shard, its provenance/hash manifest,
          the project tokenizer and its manifest, and the dataset attribution
          notes. This is a tokenizer/corpus artifact, not a trained language model.

          Source dataset card: https://huggingface.co/datasets/HuggingFaceTB/smollm-corpus
          EOF
          gh release create joseph-base-corpus-pilot-10m-2026-11-02 \
            joseph-base-corpus-10m-shard-0.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Joseph base-corpus pilot — 10M characters" \
            --notes-file release-notes.md
