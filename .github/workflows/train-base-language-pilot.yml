name: Base language foundation continuation
run-name: Warm-start existing project checkpoint for 10.24M additional token exposures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-base-language-pilot.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: joseph-base-language-continuation
  cancel-in-progress: true

jobs:
  train-calibration-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.21,<1"

      - name: Download the archived 200M training corpus and tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/corpus
          gh release download joseph-base-corpus-merged-200m-2026-11-02 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern joseph-cosmopedia-v2-merged-200m-tokenizer.zip \
            --dir data/corpus
          unzip -q data/corpus/joseph-cosmopedia-v2-merged-200m-tokenizer.zip -d data/corpus/merged

      - name: Verify the source corpus and tokenizer hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("data/corpus/merged")
          corpus = root / "cosmopedia-v2"
          manifest = json.loads((corpus / "manifest.json").read_text(encoding="utf-8"))
          tokenizer_manifest = json.loads((root / "tokenizer.json.manifest.json").read_text(encoding="utf-8"))

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert manifest["dataset_revision"] == "3ba9d60"
          assert manifest["dataset_license"] == "ODC-By-1.0"
          assert len(manifest["shards"]) == 20
          assert manifest["samples"]["total_characters"] == 199_947_904
          assert tokenizer_manifest["tokenizer_sha256"] == sha256(root / "tokenizer.json")
          assert tokenizer_manifest["input_sha256"] == sha256(corpus / "train.txt")
          assert tokenizer_manifest["tokenizer_vocab_size"] == 8192
          assert tokenizer_manifest["validation_or_test_text_used_for_fitting"] is False
          for name in ("train.txt", "validation.txt"):
              assert manifest["files"][name]["sha256"] == sha256(corpus / name)
          print(json.dumps({
              "dataset_revision": manifest["dataset_revision"],
              "license": manifest["dataset_license"],
              "samples": manifest["samples"],
              "tokenizer_vocab_size": tokenizer_manifest["tokenizer_vocab_size"],
              "tokenizer_sha256": tokenizer_manifest["tokenizer_sha256"],
              "validation_text_used_for_tokenizer": False,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Download and verify the previous calibration checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/previous-pilot
          gh run download 41541564443 \
            --repo "$GITHUB_REPOSITORY" \
            --name joseph-base-language-calibration-pilot \
            --dir artifacts/previous-pilot
          test -s artifacts/previous-pilot/base-calibration-pilot.pt
          test -s artifacts/previous-pilot/base-calibration-pilot.run.json
          printf '%s  %s\n' \
            "7700fdf27b701133d13bdf6d564dbb0f88097f7230e232b8f962ffcf8de389fc" \
            "artifacts/previous-pilot/base-calibration-pilot.pt" | sha256sum --check
          python - <<'PY'
          import json
          from pathlib import Path
          from training.checkpoint import load_checkpoint

          metadata = json.loads(Path("artifacts/previous-pilot/base-calibration-pilot.run.json").read_text())
          assert metadata["status"] == "completed"
          assert metadata["steps_completed"] == 1000
          assert metadata["tokens_seen_by_optimizer"] == 1_024_000
          payload = load_checkpoint("artifacts/previous-pilot/base-calibration-pilot.pt")
          assert payload["step"] == 1000
          assert payload["config"]["d_model"] == 128
          assert payload["config"]["n_layers"] == 4
          assert payload["config"]["n_heads"] == 4
          assert payload["config"]["block_size"] == 128
          print("Verified parent checkpoint:", payload["step"], "steps")
          PY

      - name: Warm-start and continue general-language training (10.24M additional token exposures)
        run: |
          python -m training.train \
            --input data/corpus/merged/cosmopedia-v2/train.txt \
            --validation data/corpus/merged/cosmopedia-v2/validation.txt \
            --tokenizer data/corpus/merged/tokenizer.json \
            --output artifacts/base_language/base-language-continuation.pt \
            --init-checkpoint artifacts/previous-pilot/base-calibration-pilot.pt \
            --token-cache-dir work/token-cache \
            --metrics-file artifacts/base_language/base-language-continuation.metrics.jsonl \
            --run-metadata artifacts/base_language/base-language-continuation.run.json \
            --steps 10000 \
            --batch-size 8 \
            --seq-len 128 \
            --d-model 128 \
            --n-layers 4 \
            --n-heads 4 \
            --dropout 0.1 \
            --learning-rate 0.0001 \
            --weight-decay 0.1 \
            --eval-interval 2000 \
            --eval-batches 32 \
            --seed 1337 \
            --num-threads 2 \
            --device cpu

      - name: Validate complete experimental AI payload size
        run: |
          mkdir -p artifacts/base_language/inference-pilot
          cp artifacts/base_language/base-language-continuation.pt artifacts/base_language/inference-pilot/model.pt
          cp data/corpus/merged/tokenizer.json artifacts/base_language/inference-pilot/tokenizer.json
          python - <<'PY'
          import json
          from pathlib import Path
          from joseph.config import ModelConfig
          from training.validate_ai_bundle import validate_ai_bundle

          source = Path("artifacts/base_language/base-language-continuation.run.json")
          run = json.loads(source.read_text(encoding="utf-8"))
          config = ModelConfig.from_dict(run["model_config"])
          (Path("artifacts/base_language/inference-pilot") / "config.json").write_text(
              json.dumps(config.to_dict(), indent=2) + "\n", encoding="utf-8"
          )
          report = validate_ai_bundle("artifacts/base_language/inference-pilot")
          print(json.dumps(report, indent=2))
          PY

      - name: Generate held-out qualitative text samples
        run: |
          python -m training.generate_samples \
            --checkpoint artifacts/base_language/base-language-continuation.pt \
            --tokenizer data/corpus/merged/tokenizer.json \
            --output artifacts/base_language/base-language-continuation.samples.md \
            --max-new-tokens 80 \
            --temperature 0.8 \
            --top-k 40 \
            --seed 2026

      - name: Upload continued checkpoint, metrics and generation samples
        uses: actions/upload-artifact@v4
        with:
          name: joseph-base-language-continuation-10m
          path: |
            artifacts/base_language/base-language-continuation.pt
            artifacts/base_language/base-language-continuation.metrics.jsonl
            artifacts/base_language/base-language-continuation.run.json
            artifacts/base_language/base-language-continuation.samples.md
            artifacts/base_language/inference-pilot/config.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
